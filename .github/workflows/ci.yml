name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  writing:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      # The house writing rule bans the em dash (U+2014) in every file; see standard/writing.md in shacksolutions/brain.
      - name: No em dashes
        run: |
          if git grep -nP '\x{2014}'; then
            echo "::error::Em dash (U+2014) found. Use ' - ' or recast the sentence."
            exit 1
          fi
