name: House rules

# The hard rules a machine can check, so cloud sessions and routines meet the same gate as the Macs, whose
# hearth-guard hook only runs locally: no em dashes, no AI attribution, no committed secrets. Branch protection is not
# available on this plan, so a red run flags a PR rather than blocking it. Deploys nothing.

on:
  # edited, so a PR body changed after opening is checked again for attribution.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    name: Em dashes, attribution and secrets
    runs-on: ubuntu-latest
    # A UTF-8 locale for every step, so nothing that reads text can fall back to ASCII and pass by erroring.
    env:
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit range
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            # A force-push or a first push leaves `before` unknown or unreachable, so check the pushed commit alone.
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              echo "base=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
            else
              echo "base=$GITHUB_SHA~1" >> "$GITHUB_OUTPUT"
            fi
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Em dashes and attribution
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/house_rules.py "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --no-banner --redact
          --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}"
